<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>DVCE</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        width: 360px;
        margin: 12px;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
      }
      #mode {
        font-weight: 600;
      }
      button {
        padding: 6px 10px;
      }
      pre {
        white-space: pre-wrap;
        background: #f6f7f8;
        border: 1px solid #e5e7eb;
        padding: 8px;
        height: 220px;
        overflow: auto;
        font-size: 12px;
      }
      .hint {
        font-size: 12px;
        color: #444;
      }
      code {
        background: #f0f0f0;
        padding: 1px 4px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <div>Mode:</div>
      <div id="mode">…</div>
      <button id="toggle">Toggle</button>
      <button id="clear">Clear</button>
    </div>

    <div class="row">
      <button id="options">Open Options</button>
      <div class="hint">Extension pages live on <code>chrome-extension://</code></div>
    </div>

    <div class="hint">
      Run labs locally:
      <code>cd dvce/web &amp;&amp; python3 -m http.server 8000</code>
    </div>

    <pre id="logs">Loading…</pre>

    <script src="popup.js"></script>
  </body>
</html>
