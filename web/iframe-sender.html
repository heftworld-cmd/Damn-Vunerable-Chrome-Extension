<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>DVCE Iframe Sender</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        margin: 12px;
      }
      button {
        padding: 8px 10px;
      }
      code {
        background: #f0f0f0;
        padding: 1px 4px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h2>Iframe sender (<code>127.0.0.1</code>)</h2>
    <p>This page sends a DVCE command to the parent window.</p>
    <button id="send">Send setBadge</button>

    <script>
      function send() {
        parent.postMessage(
          { dvce: true, cmd: "setBadge", args: { text: "IFRM" } },
          "*"
        );
      }

      document.getElementById("send").addEventListener("click", send);
    </script>
  </body>
</html>
